<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>RutaSales Vendedor</title>
<link rel="stylesheet" href="styles.css?v=10">
</head>
<body>
<header><h1>RutaSales</h1><div class="sub">BETA MUESTRA 1.0 · Vendedor</div></header>
<main>
  <div class="card">
    <b>App Vendedor</b>
    <label>Vendedor demo</label>
    <select id="sellerPick"></select>
    <button id="refreshSeller" type="button" class="light">🔄 Actualizar mis visitas</button>
  </div>
  <div class="grid">
    <div class="card"><div class="small">Asignadas</div><h2 id="kAssigned">0</h2></div>
    <div class="card"><div class="small">Pendientes</div><h2 id="kPending">0</h2></div>
    <div class="card"><div class="small">Completadas</div><h2 id="kDone">0</h2></div>
  </div>
  <div class="card"><b>Mis visitas</b><div id="visitsList">Cargando…</div></div>
  <div class="card"><b>Mis imprevistos</b><div id="incidentsList">Cargando…</div></div>
</main>
<div id="incidentModal" class="modal hidden">
  <div class="modalbox">
    <b>🚨 Reportar imprevisto</b>
    <label>Tipo</label>
    <select id="incidentType">
      <option value="Ponchadura">Ponchadura</option>
      <option value="Falla mecánica">Falla mecánica</option>
      <option value="Accidente">Accidente</option>
      <option value="Cliente cerrado">Cliente cerrado</option>
      <option value="Bloqueo vial">Bloqueo vial</option>
      <option value="Otro">Otro</option>
    </select>
    <label>Comentario</label>
    <textarea id="incidentDetails" rows="3" placeholder="Describe brevemente qué ocurrió"></textarea>
    <button id="incidentContinue" type="button">📍 Obtener GPS y tomar evidencia</button>
    <button id="incidentCancel" type="button" class="light">Cancelar</button>
  </div>
</div>
<div id="camModal" class="modal hidden">
  <div class="modalbox">
    <b id="camTitle">2️⃣ 📷 Evidencia en vivo</b>
    <div id="camGpsStatus" class="small"></div>
    <video id="video" autoplay playsinline muted></video>
    <button id="snapBtn" type="button">Tomar foto y enviar</button>
    <button id="cancelCam" type="button" class="light">Cancelar</button>
  </div>
</div>
<script src="vendedor.js?v=11"></script>
</body>
</html>
